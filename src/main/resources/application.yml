spring:
  application:
    name: hotel-management-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres.ivkeugvzjmvqfslxgtsi}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:Rudra@260624}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    repair-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  timezone: ${APP_TIMEZONE:Asia/Kolkata}
